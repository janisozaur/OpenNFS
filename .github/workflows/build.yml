name: Build

on: [push]

env:
  VCPKG_COMMIT_HASH: 84a143e4caf6b70db57f28d04c41df4a85c480fa

jobs:
  Linux:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev ninja-build
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}
      - name: Build
        run: |
          cmake -B bin -G Ninja -DCMAKE_BUILD_TYPE=Release .
          cmake --build bin
      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenNFS-Linux
          path: |
            bin/OpenNFS
            resources
            shaders
            LICENSE
            README.md

  Windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - triplet: x64-windows-static
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: lukka/get-cmake@latest
      - name: Install vcpkg and packages
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg/installed/${{ matrix.triplet }}
        with:
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT_HASH }}'
          runVcpkgInstall: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: |
          cmake -B bin -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} .
      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenNFS-Windows-build.ninja
          path: |
            bin/build.ninja
      - name: Build
        run: |
          cmake --build bin --config Release
          cp bin\Release\OpenNFS.exe bin\OpenNFS.exe
          cp LICENSE LICENSE.txt
      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenNFS-Windows
          path: |
            bin/OpenNFS.exe
            resources
            shaders
            LICENSE.txt
            README.md

  MacOS:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}
      - name: Build
        run: |
          cmake -B bin -DCMAKE_BUILD_TYPE=Release .
          cmake --build bin --config Release --parallel 3
      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenNFS-MacOS
          path: |
            bin/OpenNFS
            resources
            shaders
            LICENSE
            README.md

  Release:
    needs: [Linux, Windows, MacOS]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build: [Linux, Windows, MacOS]
    steps:
    - uses: actions/download-artifact@v4
    - name: Zip artifacts
      run: |
        zip -r OpenNFS-${{matrix.build}}.zip OpenNFS-${{matrix.build}}
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: OpenNFS-${{matrix.build}}.zip
        prerelease: true
        name: OpenNFS ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
